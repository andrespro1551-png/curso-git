<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Plus - Gestor Avanzado de Tareas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6d28d9;
            --primary-light: #8b5cf6;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --dark: #1f2937;
            --light: #f8fafc;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
            --border-radius: 12px;
            --border-radius-lg: 20px;
            --box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --box-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s ease;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .mobile-menu-btn {
                display: block !important;
            }
        }

        .card {
            background-color: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-lg);
            overflow: hidden;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        header {
            background: var(--gradient);
            color: white;
            padding: 30px 25px;
            text-align: center;
            border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .task-form-container {
            padding: 25px;
        }

        .task-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
        }

        .task-input {
            padding: 15px 20px;
            border: 2px solid var(--gray-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--light);
        }

        .task-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(109, 40, 217, 0.4);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background-color: #d97706;
            transform: translateY(-2px);
        }

        .btn-info {
            background-color: var(--info);
            color: white;
        }

        .btn-info:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--gray-light);
            color: var(--gray);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .task-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .select-input {
            padding: 12px 15px;
            border: 2px solid var(--gray-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            background-color: var(--light);
            transition: var(--transition);
        }

        .select-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
        }

        .filters-container {
            padding: 20px 25px;
            border-bottom: 1px solid var(--gray-light);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background-color: var(--light);
            border: 2px solid var(--gray-light);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn.active {
            background: var(--gradient);
            color: white;
            border-color: transparent;
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .search-container {
            padding: 20px 25px;
            border-bottom: 1px solid var(--gray-light);
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid var(--gray-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--light);
        }

        .search-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .task-list-container {
            padding: 0;
        }

        .task-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid var(--gray-light);
            transition: var(--transition);
            animation: fadeIn 0.5s ease;
            position: relative;
        }

        .task-item:hover {
            background-color: #fafafa;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item.completed {
            opacity: 0.7;
            background-color: #f0f9ff;
        }

        .task-checkbox {
            margin-right: 20px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--gray);
        }

        .task-priority {
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .priority-high {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .priority-medium {
            background-color: #fef3c7;
            color: var(--warning);
        }

        .priority-low {
            background-color: #d1fae5;
            color: var(--success);
        }

        .task-category {
            background-color: #e0e7ff;
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .task-date {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: var(--transition);
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-edit {
            background-color: #dbeafe;
            color: var(--info);
        }

        .btn-edit:hover {
            background-color: var(--info);
            color: white;
        }

        .btn-delete {
            background-color: #fecaca;
            color: var(--danger);
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats-container {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--gradient);
            color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--box-shadow);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .categories-container, .upcoming-tasks {
            padding: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .categories-list {
            list-style: none;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-light);
            cursor: pointer;
            transition: var(--transition);
        }

        .category-item:hover {
            color: var(--primary);
        }

        .category-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .category-count {
            background-color: var(--gray-light);
            color: var(--gray);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .upcoming-list {
            list-style: none;
        }

        .upcoming-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--gray-light);
        }

        .upcoming-item:last-child {
            border-bottom: none;
        }

        .upcoming-date {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .upcoming-text {
            font-weight: 500;
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--box-shadow-lg);
            z-index: 100;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(30deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="card">
                <div class="categories-container">
                    <h3 class="section-title"><i class="fas fa-tags"></i> Categorías</h3>
                    <ul class="categories-list" id="categoriesList">
                        <!-- Las categorías se cargarán dinámicamente -->
                    </ul>
                </div>
            </div>
            
            <div class="card">
                <div class="upcoming-tasks">
                    <h3 class="section-title"><i class="fas fa-clock"></i> Próximas Tareas</h3>
                    <ul class="upcoming-list" id="upcomingList">
                        <!-- Las tareas próximas se cargarán dinámicamente -->
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="card">
                <header>
                    <h1>TaskFlow Plus</h1>
                    <p class="subtitle">Tu gestor de tareas avanzado</p>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </header>
                
                <div class="task-form-container">
                    <div class="task-form">
                        <input type="text" class="task-input" id="taskInput" placeholder="Escribe una nueva tarea...">
                        <button class="btn btn-primary" id="addTaskBtn">
                            <i class="fas fa-plus"></i> Agregar
                        </button>
                    </div>
                    
                    <div class="task-options">
                        <select class="select-input" id="prioritySelect">
                            <option value="low">Prioridad Baja</option>
                            <option value="medium" selected>Prioridad Media</option>
                            <option value="high">Prioridad Alta</option>
                        </select>
                        
                        <select class="select-input" id="categorySelect">
                            <option value="personal">Personal</option>
                            <option value="work" selected>Trabajo</option>
                            <option value="study">Estudio</option>
                            <option value="health">Salud</option>
                            <option value="other">Otros</option>
                        </select>
                        
                        <input type="date" class="select-input" id="dueDateInput">
                        
                        <button class="btn btn-outline" id="addCategoryBtn">
                            <i class="fas fa-tag"></i> Nueva Categoría
                        </button>
                    </div>
                </div>
                
                <div class="filters-container">
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">
                            <i class="fas fa-list"></i> Todas
                        </button>
                        <button class="filter-btn" data-filter="pending">
                            <i class="fas fa-clock"></i> Pendientes
                        </button>
                        <button class="filter-btn" data-filter="completed">
                            <i class="fas fa-check-circle"></i> Completadas
                        </button>
                        <button class="filter-btn" data-filter="high">
                            <i class="fas fa-exclamation-circle"></i> Alta Prioridad
                        </button>
                        <button class="filter-btn" data-filter="today">
                            <i class="fas fa-calendar-day"></i> Hoy
                        </button>
                    </div>
                </div>
                
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchInput" placeholder="Buscar tareas...">
                    </div>
                </div>
                
                <div class="task-list-container">
                    <ul class="task-list" id="taskList">
                        <!-- Las tareas se agregarán aquí dinámicamente -->
                    </ul>
                    
                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No hay tareas</h3>
                        <p>Agrega una nueva tarea para comenzar</p>
                    </div>
                </div>
                
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-tasks"></i>
                        </div>
                        <div class="stat-value" id="totalTasks">0</div>
                        <div class="stat-label">Total Tareas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-value" id="pendingTasks">0</div>
                        <div class="stat-label">Pendientes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-value" id="completedTasks">0</div>
                        <div class="stat-label">Completadas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <div class="stat-value" id="highPriorityTasks">0</div>
                        <div class="stat-label">Alta Prioridad</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
    </button>

    <script>
        // Variables globales
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let categories = JSON.parse(localStorage.getItem('categories')) || [
            { id: 'personal', name: 'Personal', color: '#8b5cf6' },
            { id: 'work', name: 'Trabajo', color: '#3b82f6' },
            { id: 'study', name: 'Estudio', color: '#10b981' },
            { id: 'health', name: 'Salud', color: '#ef4444' },
            { id: 'other', name: 'Otros', color: '#6b7280' }
        ];
        let currentFilter = 'all';
        let currentCategory = 'all';
        let searchQuery = '';

        // Elementos del DOM
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const dueDateInput = document.getElementById('dueDateInput');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const searchInput = document.getElementById('searchInput');
        const categoriesList = document.getElementById('categoriesList');
        const upcomingList = document.getElementById('upcomingList');
        const totalTasksEl = document.getElementById('totalTasks');
        const pendingTasksEl = document.getElementById('pendingTasks');
        const completedTasksEl = document.getElementById('completedTasks');
        const highPriorityTasksEl = document.getElementById('highPriorityTasks');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const themeToggle = document.getElementById('themeToggle');

        // Inicializar la aplicación
        document.addEventListener('DOMContentLoaded', () => {
            // Establecer fecha mínima para el input de fecha (hoy)
            const today = new Date().toISOString().split('T')[0];
            dueDateInput.min = today;
            
            renderTasks();
            updateStats();
            renderCategories();
            renderUpcomingTasks();
            
            // Event listeners
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderTasks();
            });
            
            addCategoryBtn.addEventListener('click', addNewCategory);
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            themeToggle.addEventListener('click', toggleTheme);
        });

        // Función para agregar una nueva tarea
        function addTask() {
            const text = taskInput.value.trim();
            
            if (text === '') {
                showNotification('Por favor, escribe una tarea', 'warning');
                return;
            }
            
            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: prioritySelect.value,
                category: categorySelect.value,
                dueDate: dueDateInput.value || null,
                date: new Date().toLocaleDateString('es-ES'),
                createdAt: new Date().toISOString()
            };
            
            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            updateStats();
            renderUpcomingTasks();
            
            // Limpiar el input
            taskInput.value = '';
            taskInput.focus();
            dueDateInput.value = '';
            
            showNotification('Tarea agregada correctamente', 'success');
        }

        // Función para eliminar una tarea
        function deleteTask(id) {
            if (confirm('¿Estás seguro de que quieres eliminar esta tarea?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
                renderUpcomingTasks();
                showNotification('Tarea eliminada', 'danger');
            }
        }

        // Función para alternar el estado de una tarea
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            
            saveTasks();
            renderTasks();
            updateStats();
            renderUpcomingTasks();
            
            const task = tasks.find(t => t.id === id);
            if (task.completed) {
                showNotification('¡Tarea completada!', 'success');
            }
        }

        // Función para editar una tarea
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            const newText = prompt('Editar tarea:', task.text);
            
            if (newText !== null && newText.trim() !== '') {
                tasks = tasks.map(t => {
                    if (t.id === id) {
                        return { ...t, text: newText.trim() };
                    }
                    return t;
                });
                
                saveTasks();
                renderTasks();
                showNotification('Tarea actualizada', 'info');
            }
        }

        // Función para renderizar las tareas
        function renderTasks() {
            // Filtrar tareas según el filtro actual y búsqueda
            let filteredTasks = tasks.filter(task => {
                const matchesSearch = task.text.toLowerCase().includes(searchQuery);
                const matchesCategory = currentCategory === 'all' || task.category === currentCategory;
                
                let matchesFilter = true;
                if (currentFilter === 'pending') {
                    matchesFilter = !task.completed;
                } else if (currentFilter === 'completed') {
                    matchesFilter = task.completed;
                } else if (currentFilter === 'high') {
                    matchesFilter = task.priority === 'high';
                } else if (currentFilter === 'today') {
                    const today = new Date().toISOString().split('T')[0];
                    matchesFilter = task.dueDate === today;
                }
                
                return matchesSearch && matchesFilter && matchesCategory;
            });
            
            // Mostrar u ocultar estado vacío
            if (filteredTasks.length === 0) {
                emptyState.style.display = 'block';
                taskList.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                taskList.style.display = 'block';
            }
            
            // Limpiar la lista
            taskList.innerHTML = '';
            
            // Agregar tareas a la lista
            filteredTasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                // Obtener información de la categoría
                const categoryInfo = categories.find(c => c.id === task.category) || { name: 'Otros', color: '#6b7280' };
                
                taskItem.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                    <div class="task-content">
                        <div class="task-text">${task.text}</div>
                        <div class="task-meta">
                            <span class="task-priority priority-${task.priority}">
                                <i class="fas fa-${task.priority === 'high' ? 'exclamation-circle' : task.priority === 'medium' ? 'minus-circle' : 'arrow-down-circle'}"></i>
                                ${task.priority === 'high' ? 'Alta' : task.priority === 'medium' ? 'Media' : 'Baja'}
                            </span>
                            <span class="task-category" style="background-color: ${categoryInfo.color}20; color: ${categoryInfo.color}">
                                <i class="fas fa-tag"></i> ${categoryInfo.name}
                            </span>
                            ${task.dueDate ? `
                                <span class="task-date">
                                    <i class="far fa-calendar-alt"></i> ${formatDate(task.dueDate)}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon btn-edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon btn-delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                // Event listeners para los botones
                const checkbox = taskItem.querySelector('.task-checkbox');
                const deleteBtn = taskItem.querySelector('.btn-delete');
                const editBtn = taskItem.querySelector('.btn-edit');
                
                checkbox.addEventListener('change', () => toggleTask(task.id));
                deleteBtn.addEventListener('click', () => deleteTask(task.id));
                editBtn.addEventListener('click', () => editTask(task.id));
                
                taskList.appendChild(taskItem);
            });
        }

        // Función para renderizar las categorías
        function renderCategories() {
            categoriesList.innerHTML = '';
            
            // Agregar opción "Todas"
            const allItem = document.createElement('li');
            allItem.className = `category-item ${currentCategory === 'all' ? 'active' : ''}`;
            allItem.innerHTML = `
                <span>Todas</span>
                <span class="category-count">${tasks.length}</span>
            `;
            allItem.addEventListener('click', () => {
                currentCategory = 'all';
                renderCategories();
                renderTasks();
            });
            categoriesList.appendChild(allItem);
            
            // Agregar categorías
            categories.forEach(category => {
                const categoryTasks = tasks.filter(task => task.category === category.id);
                
                const categoryItem = document.createElement('li');
                categoryItem.className = `category-item ${currentCategory === category.id ? 'active' : ''}`;
                categoryItem.innerHTML = `
                    <span>${category.name}</span>
                    <span class="category-count">${categoryTasks.length}</span>
                `;
                categoryItem.addEventListener('click', () => {
                    currentCategory = category.id;
                    renderCategories();
                    renderTasks();
                });
                categoriesList.appendChild(categoryItem);
            });
        }

        // Función para renderizar las tareas próximas
        function renderUpcomingTasks() {
            upcomingList.innerHTML = '';
            
            // Obtener tareas pendientes con fecha de vencimiento
            const upcomingTasks = tasks
                .filter(task => !task.completed && task.dueDate)
                .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
                .slice(0, 5); // Mostrar solo las 5 próximas
            
            if (upcomingTasks.length === 0) {
                upcomingList.innerHTML = '<p style="text-align: center; color: var(--gray); padding: 20px 0;">No hay tareas próximas</p>';
                return;
            }
            
            upcomingTasks.forEach(task => {
                const upcomingItem = document.createElement('li');
                upcomingItem.className = 'upcoming-item';
                upcomingItem.innerHTML = `
                    <div class="upcoming-date">
                        <i class="far fa-calendar-alt"></i> ${formatDate(task.dueDate)}
                    </div>
                    <div class="upcoming-text">${task.text}</div>
                `;
                upcomingList.appendChild(upcomingItem);
            });
        }

        // Función para agregar una nueva categoría
        function addNewCategory() {
            const categoryName = prompt('Nombre de la nueva categoría:');
            if (categoryName && categoryName.trim() !== '') {
                const newCategory = {
                    id: categoryName.toLowerCase().replace(/\s+/g, '-'),
                    name: categoryName.trim(),
                    color: getRandomColor()
                };
                
                categories.push(newCategory);
                saveCategories();
                renderCategories();
                
                // Actualizar el select de categorías
                const option = document.createElement('option');
                option.value = newCategory.id;
                option.textContent = newCategory.name;
                categorySelect.appendChild(option);
                
                showNotification('Categoría agregada', 'success');
            }
        }

        // Función para actualizar las estadísticas
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;
            const highPriority = tasks.filter(task => task.priority === 'high' && !task.completed).length;
            
            totalTasksEl.textContent = total;
            completedTasksEl.textContent = completed;
            pendingTasksEl.textContent = pending;
            highPriorityTasksEl.textContent = highPriority;
        }

        // Función para guardar tareas en localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Función para guardar categorías en localStorage
        function saveCategories() {
            localStorage.setItem('categories', JSON.stringify(categories));
        }

        // Función para formatear fechas
        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'short' };
            return new Date(dateString).toLocaleDateString('es-ES', options);
        }

        // Función para generar colores aleatorios
        function getRandomColor() {
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Función para mostrar notificaciones
        function showNotification(message, type) {
            // Crear elemento de notificación
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : type === 'danger' ? 'times-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            // Estilos para la notificación
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#10b981' : type === 'warning' ? '#f59e0b' : type === 'danger' ? '#ef4444' : '#3b82f6'};
                color: white;
                padding: 15px 20px;
                border-radius: var(--border-radius);
                box-shadow: var(--box-shadow);
                z-index: 1000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                max-width: 300px;
            `;
            
            document.body.appendChild(notification);
            
            // Animación de entrada
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Eliminar después de 3 segundos
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        // Función para alternar el menú móvil
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = sidebar.style.display === 'flex' ? 'none' : 'flex';
        }

        // Función para alternar el tema
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('dark-theme')) {
                icon.className = 'fas fa-sun';
                document.body.style.background = 'linear-gradient(135deg, #1e3a8a 0%, #581c87 100%)';
            } else {
                icon.className = 'fas fa-moon';
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }
        }

        // Agregar estilos para el tema oscuro
        const darkThemeStyles = `
            <style>
                body.dark-theme {
                    background: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%) !important;
                    color: #e5e7eb;
                }
                
                body.dark-theme .card {
                    background-color: #374151;
                    color: #e5e7eb;
                }
                
                body.dark-theme .task-input,
                body.dark-theme .search-input,
                body.dark-theme .select-input {
                    background-color: #4b5563;
                    border-color: #6b7280;
                    color: #e5e7eb;
                }
                
                body.dark-theme .task-input:focus,
                body.dark-theme .search-input:focus,
                body.dark-theme .select-input:focus {
                    border-color: var(--primary-light);
                }
                
                body.dark-theme .task-item:hover {
                    background-color: #4b5563;
                }
                
                body.dark-theme .btn-outline {
                    background-color: transparent;
                    border-color: #6b7280;
                    color: #9ca3af;
                }
                
                body.dark-theme .btn-outline:hover {
                    border-color: var(--primary-light);
                    color: var(--primary-light);
                }
                
                body.dark-theme .filter-btn {
                    background-color: #4b5563;
                    border-color: #6b7280;
                    color: #9ca3af;
                }
                
                body.dark-theme .filter-btn:hover:not(.active) {
                    border-color: var(--primary-light);
                    color: var(--primary-light);
                }
                
                body.dark-theme .empty-state {
                    color: #9ca3af;
                }
            </style>
        `;
        
        document.head.insertAdjacentHTML('beforeend', darkThemeStyles);
    </script>
</body>
</html>
